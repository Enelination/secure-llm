apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.10.1

    helm:
      releaseName: kube-prometheus-stack
      values: |
        grafana:
          grafana.ini:
            server:
              domain: grafana.rogfoundation.org
              root_url: https://grafana.rogfoundation.org/
            security:
              cookie_secure: "true"
              cookie_samesite: "lax"

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
