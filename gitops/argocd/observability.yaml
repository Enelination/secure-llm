apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.10.1

    helm:
      releaseName: kube-prometheus-stack
      values: |
        grafana:
          grafana.ini:
            server:
              domain: grafana.rogfoundation.org
              root_url: https://grafana.rogfoundation.org/
            security:
              cookie_secure: "true"
              cookie_samesite: "lax"

        prometheus:
          prometheusSpec:
            ruleSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            retention: 15d

        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: default
              group_by: ["alertname", "namespace", "component"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - matchers:
                    - severity="critical"
                  receiver: slack-critical
                  continue: false
                - matchers:
                    - severity="warning"
                  receiver: slack-warning
                  continue: false
            receivers:
              - name: default
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/slack-webhook/webhook-url
                    channel: "#securellm-alerts"
                    send_resolved: true
                    title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
                    text: >-
                      {{ range .Alerts }}{{ .Annotations.summary }}
                      {{ .Annotations.description }}
                      {{ end }}
              - name: slack-critical
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/slack-webhook/webhook-url
                    channel: "#securellm-alerts"
                    send_resolved: true
                    color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
                    title: '[CRITICAL] {{ .CommonLabels.alertname }}'
                    text: >-
                      {{ range .Alerts }}{{ .Annotations.summary }}
                      {{ .Annotations.description }}
                      {{ end }}
              - name: slack-warning
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/slack-webhook/webhook-url
                    channel: "#securellm-alerts"
                    send_resolved: true
                    color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
                    title: '[WARNING] {{ .CommonLabels.alertname }}'
                    text: >-
                      {{ range .Alerts }}{{ .Annotations.summary }}
                      {{ .Annotations.description }}
                      {{ end }}
          alertmanagerSpec:
            secrets:
              - slack-webhook

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
