apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securellm-secrets
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Enelination/secure-llm.git
    targetRevision: main
    path: gitops/overlays/dev/secrets-config

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
