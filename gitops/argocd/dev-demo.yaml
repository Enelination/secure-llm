apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securellm-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Enelination/secure-llm.git
    targetRevision: main
    path: gitops/overlays/dev/demo

  destination:
    server: https://kubernetes.default.svc
    namespace: securellm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
