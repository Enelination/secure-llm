apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: securellm-api-keys
  namespace: securellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: securellm-api-keys
    creationPolicy: Merge
  dataFrom:
    - extract:
        key: securellm/api-keys
