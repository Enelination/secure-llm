apiVersion: v1
kind: ConfigMap
metadata:
  name: securellm-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  securellm.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "title": "SecureLLM",
      "uid": "securellm-overview",
      "tags": ["securellm", "llm"],
      "timezone": "browser",
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          },
          {
            "name": "provider",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": "label_values(llm_requests_total, provider)",
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Requests (last 1h)",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(increase(llm_requests_total{provider=~\"$provider\"}[1h]))",
              "refId": "A"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error Rate (5m)",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "(100 * sum(rate(llm_errors_total{provider=~\"$provider\"}[5m])) / clamp_min(sum(rate(llm_requests_total{provider=~\"$provider\"}[5m])), 0.0001)) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 5 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "P95 Latency",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(llm_request_duration_seconds_bucket{provider=~\"$provider\"}[5m])) by (le))",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 2 }, { "color": "red", "value": 5 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Token Throughput (tokens/s)",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(llm_tokens_total{provider=~\"$provider\"}[5m]))",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "In-flight Requests",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(llm_inflight_requests{provider=~\"$provider\"})",
              "refId": "A"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Model Health",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "min(llm_model_up{provider=~\"$provider\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "mappings": [ { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } } ], "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Request Rate by Status",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total{job=\"securellm-ai-gateway\"}[5m]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10, "stacking": { "mode": "normal" } } }, "overrides": [] }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "LLM Latency (P50 / P95 / P99)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(llm_request_duration_seconds_bucket{provider=~\"$provider\"}[5m])) by (le))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(llm_request_duration_seconds_bucket{provider=~\"$provider\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(llm_request_duration_seconds_bucket{provider=~\"$provider\"}[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "fillOpacity": 0, "lineWidth": 2 } }, "overrides": [] }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "LLM Requests & Errors",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(llm_requests_total{provider=~\"$provider\"}[5m]))",
              "legendFormat": "requests/s",
              "refId": "A"
            },
            {
              "expr": "sum(rate(llm_errors_total{provider=~\"$provider\"}[5m])) or vector(0)",
              "legendFormat": "errors/s",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10 } }, "overrides": [] }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Token Throughput by Type",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(llm_prompt_tokens_total{provider=~\"$provider\"}[5m]))",
              "legendFormat": "prompt tokens/s",
              "refId": "A"
            },
            {
              "expr": "sum(rate(llm_completion_tokens_total{provider=~\"$provider\"}[5m]))",
              "legendFormat": "completion tokens/s",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "none", "custom": { "fillOpacity": 10 } }, "overrides": [] }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Model Up / Reachability",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "llm_model_up{provider=~\"$provider\"}",
              "legendFormat": "{{model}} ({{provider}})",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "min": 0, "max": 1, "custom": { "fillOpacity": 10, "lineWidth": 2 } }, "overrides": [] }
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "In-flight Requests",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum by (provider) (llm_inflight_requests{provider=~\"$provider\"})",
              "legendFormat": "{{provider}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "none", "min": 0, "custom": { "fillOpacity": 10 } }, "overrides": [] }
        }
      ]
    }
