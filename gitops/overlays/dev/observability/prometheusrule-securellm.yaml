apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: securellm-alerts
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: securellm.gateway
      rules:
        - alert: SecureLLMGatewayDown
          expr: up{job="securellm-ai-gateway"} == 0
          for: 2m
          labels:
            severity: critical
            component: ai-gateway
          annotations:
            summary: "SecureLLM AI Gateway is down"
            description: "Prometheus cannot scrape the AI Gateway target ({{ $labels.instance }}) for 2m."

        - alert: SecureLLMModelDown
          expr: min by (provider, model) (llm_model_up) == 0
          for: 3m
          labels:
            severity: critical
            component: model
          annotations:
            summary: "SecureLLM model {{ $labels.model }} is unreachable"
            description: "The upstream model provider ({{ $labels.provider }}/{{ $labels.model }}) has been reporting unhealthy for 3m."

        - alert: SecureLLMHighErrorRate
          expr: |
            (
              sum(rate(llm_errors_total[5m]))
              /
              clamp_min(sum(rate(llm_requests_total[5m])), 0.0001)
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            component: ai-gateway
          annotations:
            summary: "SecureLLM LLM error rate above 5%"
            description: "LLM error rate is {{ $value | humanizePercentage }} over the last 5m."

        - alert: SecureLLMHighLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(llm_request_duration_seconds_bucket[5m])) by (le)
            ) > 5
          for: 5m
          labels:
            severity: warning
            component: model
          annotations:
            summary: "SecureLLM P95 LLM latency above 5s"
            description: "P95 LLM inference latency is {{ $value }}s over the last 5m."

        - alert: SecureLLMNoTraffic
          expr: sum(rate(llm_requests_total[15m])) == 0
          for: 15m
          labels:
            severity: info
            component: ai-gateway
          annotations:
            summary: "SecureLLM AI Gateway has received no LLM traffic"
            description: "No LLM inference requests observed in the last 15m."

        - alert: SecureLLMHTTP5xxRate
          expr: |
            (
              sum(rate(http_requests_total{job="securellm-ai-gateway",status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(http_requests_total{job="securellm-ai-gateway"}[5m])), 0.0001)
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            component: ai-gateway
          annotations:
            summary: "SecureLLM AI Gateway 5xx rate above 5%"
            description: "HTTP 5xx rate is {{ $value | humanizePercentage }} over the last 5m."
