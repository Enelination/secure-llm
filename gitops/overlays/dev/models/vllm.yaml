apiVersion: apps/v1
kind: Deployment
metadata:
  name: securellm-vllm
  namespace: securellm-models
spec:
  replicas: 0
  selector:
    matchLabels:
      app: securellm-vllm
  template:
    metadata:
      labels:
        app: securellm-vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model
            - Qwen/Qwen2.5-1.5B-Instruct
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "8Gi"
