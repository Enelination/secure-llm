apiVersion: apps/v1
kind: Deployment
metadata:
  name: securellm-llama
  namespace: securellm-models
spec:
  replicas: 1

  selector:
    matchLabels:
      app: securellm-llama

  template:
    metadata:
      labels:
        app: securellm-llama

    spec:
      nodeSelector:
        workload: llm-cpu

      tolerations:
        - key: workload
          operator: Equal
          value: llm-cpu
          effect: NoSchedule

      initContainers:
        - name: model-downloader
          image: curlimages/curl:latest
          command:
            - sh
            - -c
          args:
            - |
              if [ ! -f /models/qwen2.5-1.5b-instruct-q4_k_m.gguf ]; then
                echo "Downloading Qwen 2.5 1.5B model..."
                curl -L --fail --retry 3 \
                  -o /models/qwen2.5-1.5b-instruct-q4_k_m.gguf \
                  https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
              else
                echo "Model already exists. Skipping download."
              fi

              echo "Model ready:"
              ls -lh /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
          volumeMounts:
            - name: model-storage
              mountPath: /models

      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server

          args:
            - -m
            - /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - -c
            - "2048"
            - -t
            - "8"

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"

          volumeMounts:
            - name: model-storage
              mountPath: /models

      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: llama-model-pvc
