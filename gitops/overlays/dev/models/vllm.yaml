apiVersion: apps/v1
kind: Deployment
metadata:
  name: securellm-llama
  namespace: securellm-models
spec:
  replicas: 1

  selector:
    matchLabels:
      app: securellm-llama

  template:
    metadata:
      labels:
        app: securellm-llama

    spec:
      nodeSelector:
        workload: llm-cpu

      tolerations:
        - key: workload
          operator: Equal
          value: llm-cpu
          effect: NoSchedule

      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server

          command:
            - /bin/sh
            - -c

          args:
            - |
              if [ ! -f /models/qwen2.5-1.5b-instruct-q4_k_m.gguf ]; then
                echo "Downloading model..."
                wget -O /models/qwen2.5-1.5b-instruct-q4_k_m.gguf \
                  https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
              fi

              echo "Starting llama.cpp..."
              /app/llama-server \
                -m /models/qwen2.5-1.5b-instruct-q4_k_m.gguf \
                --host 0.0.0.0 \
                --port 8000 \
                -c 2048 \
                -t 8

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"

          volumeMounts:
            - name: model-storage
              mountPath: /models

      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: llama-model-pvc
