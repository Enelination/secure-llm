apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: securellm-ai-gateway
  namespace: securellm
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: securellm
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:391727473376:certificate/30eedffe-ba1c-4d3c-b986-8e04fb6788d2
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - host: api.rogfoundation.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: securellm-ai-gateway
                port:
                  number: 80
