apiVersion: apps/v1
kind: Deployment
metadata:
  name: securellm-ai-gateway
  namespace: securellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: securellm-ai-gateway
  template:
    metadata:
      labels:
        app: securellm-ai-gateway
    spec:
      containers:
        - name: ai-gateway
          image: 391727473376.dkr.ecr.us-east-1.amazonaws.com/securellm/ai-gateway:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
