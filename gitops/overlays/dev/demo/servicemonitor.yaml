apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: securellm-ai-gateway
  namespace: securellm
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: securellm-ai-gateway

  endpoints:
    - port: http
      path: /metrics
      interval: 15s

