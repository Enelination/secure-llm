name: AI Gateway CI

on:
  push:
    branches:
      - main
    paths:
      - "applications/ai-gateway/**"
      - ".github/workflows/ai-gateway-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "applications/ai-gateway/**"
      - ".github/workflows/ai-gateway-ci.yml"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: securellm/ai-gateway
  IMAGE_NAME: securellm-ai-gateway
  GITOPS_FILE: gitops/overlays/dev/demo/kustomization.yaml


jobs:

  # ============================================================
  # TEST
  # ============================================================

  test:
    name: Test AI Gateway
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: applications/ai-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Compile Python
        run: |
          python -m compileall .

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pytest -v
          else
            echo "No tests directory found. Skipping pytest."
          fi


  # ============================================================
  # SECURITY
  # ============================================================

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: applications/ai-gateway
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true


  # ============================================================
  # BUILD + IMAGE SECURITY SCAN
  #
  # Runs on both PRs and pushes.
  # Does NOT require AWS credentials.
  # ============================================================

  build:
    name: Build and Scan Docker Image
    needs:
      - test
      - security

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${IMAGE_TAG}"

      - name: Build Docker image
        working-directory: applications/ai-gateway
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }} \
            .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}"
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Docker image summary
        run: |
          echo "### Docker Image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # PUBLISH TO ECR
  #
  # Only runs on direct pushes to main.
  # ============================================================

  publish:
    name: Publish Image to ECR
    needs:
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"

          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Image tag: ${IMAGE_TAG}"

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::391727473376:role/GitHubActions-SecureLLM
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Verify AWS identity
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Login to ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Build image
      # --------------------------------------------------------

      - name: Build Docker image
        working-directory: applications/ai-gateway
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }} \
            .

      # --------------------------------------------------------
      # Final Trivy image scan
      # --------------------------------------------------------

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}"
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # --------------------------------------------------------
      # Push image
      # --------------------------------------------------------

      - name: Push image to ECR
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}"

          docker push "$IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Summary
      # --------------------------------------------------------

      - name: Publish summary
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}"

          echo "### SecureLLM AI Gateway" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Image published successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # UPDATE GITOPS
  #
  # Updates the immutable image tag in Kustomize.
  #
  # This job commits the GitOps change back to main.
  #
  # Argo CD then detects the Git change and deploys it.
  # ============================================================

  gitops:
    name: Update GitOps
    needs:
      - publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update image tag
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          echo "Updating GitOps image tag to: ${IMAGE_TAG}"

          python - <<'PY'
          from pathlib import Path
          import os
          import re

          file = Path(os.environ["GITOPS_FILE"])
          tag = os.environ["IMAGE_TAG"]

          content = file.read_text()

          updated = re.sub(
              r'(\s+newTag:\s*)[^\s]+',
              rf'\g<1>{tag}',
              content,
              count=1,
          )

          if updated == content:
              raise SystemExit(
                  f"Could not find newTag in {file}"
              )

          file.write_text(updated)
          PY

          echo "Updated GitOps manifest:"
          cat "$GITOPS_FILE"

      - name: Check Git diff
        run: |
          git diff -- "$GITOPS_FILE"

      - name: Commit GitOps change
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$GITOPS_FILE"

          if git diff --cached --quiet; then
            echo "No GitOps changes detected."
            exit 0
          fi

          git commit -m "chore: deploy ai-gateway ${IMAGE_TAG}"

          # Rebase onto main and retry in case a human push landed meanwhile
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying..."
            sleep 10
          done

      - name: Deployment summary
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          echo "### GitOps Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ GitOps manifest updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image tag:** \`${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Argo CD should now reconcile the change." >> "$GITHUB_STEP_SUMMARY"