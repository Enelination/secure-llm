name: AI Gateway CI

on:
  pull_request:
    paths:
      - "applications/ai-gateway/**"
      - ".github/workflows/ai-gateway-ci.yml"

  push:
    branches:
      - main
    paths:
      - "applications/ai-gateway/**"
      - ".github/workflows/ai-gateway-ci.yml"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: securellm/ai-gateway

jobs:

  # --------------------------------------------------
  # TEST
  # --------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: applications/ai-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          pip install pytest httpx

      - name: Compile application
        run: |
          python -m compileall .

  # --------------------------------------------------
  # SECURITY SCAN
  # --------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: applications/ai-gateway
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # --------------------------------------------------
  # BUILD + SCAN + PUSH
  # --------------------------------------------------
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest

    needs:
      - test
      - security

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------
      # AWS OIDC
      # ----------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::391727473376:role/GitHubActions-SecureLLM
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------
      # ECR LOGIN
      # ----------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------
      # BUILD
      # ----------------------------------------------
      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            applications/ai-gateway

      # ----------------------------------------------
      # CONTAINER SECURITY SCAN
      # ----------------------------------------------
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # ----------------------------------------------
      # PUSH ONLY AFTER SECURITY SCAN PASSES
      # ----------------------------------------------
      - name: Push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # ----------------------------------------------
      # SHOW IMAGE
      # ----------------------------------------------
      - name: Image summary
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Image successfully pushed:"
          echo "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"