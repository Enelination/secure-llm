name: AI Gateway CI

on:
  push:
    branches:
      - main
    paths:
      - "applications/ai-gateway/**"
      - ".github/workflows/ai-gateway-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "applications/ai-gateway/**"
      - ".github/workflows/ai-gateway-ci.yml"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: securellm/ai-gateway
  IMAGE_NAME: securellm-ai-gateway


# ============================================================
# TEST
# ============================================================

jobs:

  test:
    name: Test AI Gateway
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: applications/ai-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Compile Python
        run: |
          python -m compileall .

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pytest -v
          else
            echo "No tests directory found. Skipping pytest."
          fi


  # ============================================================
  # SECURITY
  # ============================================================

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: applications/ai-gateway
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true


  # ============================================================
  # BUILD + IMAGE SECURITY SCAN
  #
  # Runs on both PRs and pushes.
  # Does NOT require AWS credentials.
  # ============================================================

  build:
    name: Build and Scan Docker Image
    needs:
      - test
      - security

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${IMAGE_TAG}"

      - name: Build Docker image
        working-directory: applications/ai-gateway
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }} \
            .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}"
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Docker image summary
        run: |
          echo "### Docker Image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # PUSH TO ECR
  #
  # IMPORTANT:
  # This job ONLY runs after a direct push to main.
  #
  # This matches the IAM trust policy:
  #
  # repo:Enelination/secure-llm:ref:refs/heads/main
  # ============================================================

  publish:
    name: Publish Image to ECR
    needs:
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${IMAGE_TAG}"

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::391727473376:role/GitHubActions-SecureLLM
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Verify AWS identity
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Login to ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Build image
      #
      # We rebuild here because GitHub Actions jobs have
      # separate runners.
      # --------------------------------------------------------

      - name: Build Docker image
        working-directory: applications/ai-gateway
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }} \
            .

      # --------------------------------------------------------
      # Final image security scan before pushing
      # --------------------------------------------------------

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}"
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # --------------------------------------------------------
      # Push image
      # --------------------------------------------------------

      - name: Push image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}

      # --------------------------------------------------------
      # Summary
      # --------------------------------------------------------

      - name: Publish summary
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}"

          echo "### SecureLLM AI Gateway" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Image published successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"