name: AI Gateway CI

on:
  pull_request:
    paths:
      - "applications/ai-gateway/**"
      - ".github/workflows/ai-gateway-ci.yml"

  push:
    branches:
      - main
    paths:
      - "applications/ai-gateway/**"
      - ".github/workflows/ai-gateway-ci.yml"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: securellm/ai-gateway

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: applications/ai-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          pip install pytest httpx

      - name: Compile application
        run: |
          python -m compileall .

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: applications/ai-gateway
          severity: HIGH,CRITICAL
          exit-code: "1"

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs:
      - test
      - security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t securellm-ai-gateway:${{ github.sha }} \
            applications/ai-gateway

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: securellm-ai-gateway:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true